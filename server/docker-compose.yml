name: dsh-remote-tunnel

services:
  relay:
    build:
      context: .
    env_file:
      - ${RELAY_ENV_FILE:-.env}
    environment:
      DATA_DIR: /data
    volumes:
      - relay-data:/data
    ports:
      # Local-only management/health port. Caddy is the public listener.
      - "127.0.0.1:18080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    env_file:
      - ${RELAY_ENV_FILE:-.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  relay-data:
  caddy-data:
  caddy-config:
